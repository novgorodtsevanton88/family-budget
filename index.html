<div id="lk"><style>#lk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 20% 0%,#1d3a2e 0%,#0b1a14 60%,#07110d 100%);font-family:Manrope,system-ui,sans-serif;color:#efe9d8;z-index:9999}

var lazy=false,L={},LD=null,hid=0,lastW=0,wt=null,OK=false;
function minV(){return typeof L.min==='number'?L.min:1440}
function persist(now){
 try{LS.setItem('fb_lkc',JSON.stringify(L))}catch(e){}
 if(!LD){if(!lazy){lazy=true;cloudDoc().then(function(d){lazy=false;if(d){LD=d;persist(true)}}).catch(function(){lazy=false})}return}
 clearTimeout(wt);
 var go=function(){lastW=Date.now();try{LD.set(JSON.parse(JSON.stringify(L))).catch(function(){})}catch(e){}};
 if(now)go();else wt=setTimeout(go,400);
}
function touch(force){if(!L.k)return;L.t=Date.now();if(force||Date.now()-lastW>60000)persist(force)}
function waitClaude(ms){return new Promise(function(r){var t=Date.now();(function p(){if(window.claude&&claude.use)return r(true);if(Date.now()-t>ms)return r(false);setTimeout(p,150)})()})}
function cloudDoc(){
 try{
  if(!(window.claude&&claude.use))return Promise.resolve(null);
  return Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
   if(!r[0]||!r[1])return null;
   return r[1].id().then(function(uid){return uid?r[0].collection('data/users/'+uid).doc('lock'):null});
  }).catch(function(){return null});
 }catch(e){return Promise.resolve(null)}
}
function lim(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
async function keyFrom(pw,D){
 var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n||250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);

async function appKey(pw){
 if(L.w&&L.w.c&&L.w.s&&L.w.i){
  var wk=await keyFrom(pw,L.w);
  var raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(L.w.i)},wk,b(L.w.c));
  return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);

}
async function decWith(key,D){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c)))}

}
function run(html){
 OK=true;
 var t=document.createElement('template');t.innerHTML=html;
 [].slice.call(t.content.querySelectorAll('script')).forEach(function(o){var n=document.createElement('script');n.textContent=o.textContent;o.parentNode.replaceChild(n,o)});
 var lk=document.getElementById('lk'),fm=document.getElementById('lkf'),ld=document.getElementById('lkl');

 setTimeout(function(){if(window.__appReady)window.__appReady()},6000);

 try{window.addEventListener('pagehide',function(){touch(true)})}catch(e){}

async function resume(){
 var m=minV();
 if(m===0||!L.k||!L.t)return false;
 if(m>0&&Date.now()-L.t>m*60000){delete L.k;persist(true);return false}
 try{
  var key=await crypto.subtle.importKey('raw',b(L.k),'AES-GCM',true,['encrypt','decrypt']);

}
async function init(){
 try{
  try{L=JSON.parse(LS.getItem('fb_lkc')||'{}')||{}}catch(e){L={}}
  await waitClaude(6000);
  var d=await lim(cloudDoc(),12000);

   }
  }
  if(L.blob){delete L.blob;delete L.k;persist(true)}
  if(await resume())return;

}
