<div id="lk"><style>#lk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 20% 0%,#1d3a2e 0%,#0b1a14 60%,#07110d 100%);font-family:Manrope,system-ui,sans-serif;color:#efe9d8;z-index:9999}

function snap(id,data){return {id:id,exists:data!=null,data:function(){return data==null?undefined:clone(data)}}}
function qsnap(rows){var docs=(rows||[]).map(function(r){return snap(r.id,r.data)});return {docs:docs,empty:!docs.length,size:docs.length,forEach:function(f){docs.forEach(f)}}}
function chk(r){if(r.error)throw r.error;return r.data}
function colGet(path){return sb.from('docs').select('id,data').eq('col',path).then(function(r){return qsnap(chk(r))})}
function collection(path){
 return {
  id:path,
  doc:function(id){return {id:id,
   get:function(){return sb.from('docs').select('data').eq('col',path).eq('id',id).maybeSingle().then(function(r){var d=chk(r);return snap(id,d?d.data:null)})},
   set:function(obj){return sb.from('docs').upsert({col:path,id:id,data:clone(obj),updated_at:new Date().toISOString(),updated_by:UID},{onConflict:'col,id'}).then(function(r){chk(r)})},
   'delete':function(){return sb.from('docs').delete().eq('col',path).eq('id',id).then(function(r){chk(r)})}
  }},
  get:function(){return colGet(path)},
  onSnapshot:function(cb,err){
   var live=true,first=true,t=null,ch=null,iv=null;
   function pull(){colGet(path).then(function(q){if(!live)return;first=false;cb(q)}).catch(function(e){if(live&&first&&err){live=false;stop();err(e)}})}
   function soon(){clearTimeout(t);t=setTimeout(pull,300)}
   function vis(){if(!document.hidden)soon()}
   function stop(){clearTimeout(t);clearInterval(iv);document.removeEventListener('visibilitychange',vis);try{if(ch)sb.removeChannel(ch)}catch(e){}ch=null}
   try{ch=sb.channel('docs-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+path},soon).subscribe(function(s){if(s==='SUBSCRIBED'&&!first)soon()})}catch(e){}
   document.addEventListener('visibilitychange',vis);
   iv=setInterval(function(){if(!document.hidden)pull()},15000);
   pull();
   return function(){live=false;stop()};
  }
 };
}
var db={collection:collection};
var user={
 id:function(){return Promise.resolve(UID)},
 can:function(p){if(p!=='data.write')return Promise.resolve(true);if(CANW!==null)return Promise.resolve(CANW);
  return sb.from('members').select('can_write').eq('user_id',UID).maybeSingle().then(function(r){var d=chk(r);CANW=d?!!d.can_write:false;return CANW}).catch(function(){return null})},
 canEdit:function(){return user.can('data.write')},
 isOwner:function(){return Promise.resolve(false)}
};
var downloads={save:function(f){
 var type=/\.csv$/i.test(f.filename)?'text/csv':'application/json',data=(type==='text/csv'?'﻿':'')+f.data;
 var blob=new Blob([data],{type:type});
 try{var file=new File([blob],f.filename,{type:type});
  if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file]}).catch(function(e){throw {code:e&&e.name==='AbortError'?'declined':'error'}});
 }catch(e){}
 return new Promise(function(res){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();res()},500)});
}};
function api(){return {use:function(n){return Promise.resolve(n==='db'?db:n==='user'?user:n==='downloads'?downloads:null)}}}
function boot(session){
 if(booted)return;booted=true;
 if(session){UID=session.user.id;window.claude=api();try{localStorage.setItem('fb_uid',UID)}catch(e){}}
 hide();
 if(window.__lockBoot)window.__lockBoot();
}
window.__signOut=function(){if(!sb)return;sb.auth.signOut().finally(function(){try{localStorage.removeItem('fb_lkc')}catch(e){}location.reload()})};
af.addEventListener('submit',function(e){
 e.preventDefault();if(ab.disabled)return;
 var em=ae.value.trim(),pw=ap.value;if(!em||!pw){am.textContent='Введіть пошту й пароль';return}
 ab.disabled=true;am.textContent='Входжу…';
 sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
  ab.disabled=false;
  if(r.error){var m=r.error.message||'';am.textContent=/invalid/i.test(m)?'Невірна пошта або пароль':/fetch|network/i.test(m)?'Немає інтернету':'Помилка входу: '+m;return}
  am.textContent='';boot(r.data.session);
 }).catch(function(){ab.disabled=false;am.textContent='Немає звʼязку із сервером'});
});
function start(){
 if(!window.supabase||!supabase.createClient){
  // бібліотека не завантажилась (немає інтернету при першому запуску): працюємо лише локально
  boot(null);return;
 }
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fb_auth'}});
 function offline(){var u=null;try{u=localStorage.getItem('fb_uid')}catch(e){}if(u&&!navigator.onLine){boot({user:{id:u}});return true}return false}
 sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s)boot(s);else if(!offline())show(true)}).catch(function(){if(!offline())show(true)});
}
show(false);start();
})();

</script>
